slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    resolution: 0.05
    min_laser_range: 0.12      # your lidar's min range
    max_laser_range: 10.0      # your lidar's max range
    map_update_interval: 2.0   # stock is 5.0; shorter means frontiers update sooner
    minimum_travel_distance: 0.2   # stock is 0.5; smaller suits a small robot
    minimum_travel_heading: 0.2
    transform_timeout: 0.5